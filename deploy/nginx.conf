# /etc/nginx/sites-available/kendex   (reemplaza kendex.example.com)
server {
    listen 80;
    server_name kendex.example.com;
    return 301 https://$host$request_uri;            # HTTPS obligatorio (checklist 4)
}

server {
    listen 443 ssl http2;
    server_name kendex.example.com;

    ssl_certificate     /etc/letsencrypt/live/kendex.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kendex.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/kendex/public;
    index index.php;
    client_max_body_size 12m;                         # comprobantes de hasta 10 MB

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /build/ { expires 1y; add_header Cache-Control "public, immutable"; }   # velocidad (checklist 12)
    location ~* \.(png|svg|ico|webp|jpg)$ { expires 30d; add_header Cache-Control "public"; }

    location / { try_files $uri $uri/ /index.php?$query_string; }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~ /\.(?!well-known).* { deny all; }
}
